<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyMedin</title>
    <meta
      name="description"
      content="Find doctors nearby, book appointments, and manage your medical practice."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Critical splash styles in <head> so the splash is centered on the very
         first paint (avoids a flash where it renders un-positioned, then jumps). -->
    <style>
      html, body { margin: 0; height: 100%; background: #f2f6fc; }
      #splash {
        position: fixed;
        top: 0;
        left: 0;
        /* Size to the DYNAMIC viewport (both axes) and anchor from the top-left
           only — never to right/bottom. This keeps the splash locked to the
           actually-visible area so its flex-centered content can't drift when the
           mobile address bar shows/hides (vertical) or content briefly overflows
           (horizontal). vw/vh are the fallbacks for older browsers. */
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f6fc;
        /* System fonts only — the splash must not depend on Inter loading, or a
           late web-font swap would reflow and visibly nudge the centered content. */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 240px;
        max-width: 70vw;
      }
      .splash-logo {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 10px 28px rgba(58, 114, 227, 0.32);
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .splash-name {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
        color: #14233c;
      }
      .splash-track {
        width: 100%;
        height: 6px;
        background: #dde9fb;
        border-radius: 999px;
        overflow: hidden;
      }
      #splash-bar {
        height: 100%;
        width: 0;
        background: #3a72e3;
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      #splash-pct {
        font-size: 13px;
        color: #6480a6;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyMedin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- System fonts for UI (Facebook-style); only the Material Symbols icon font is loaded. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Dynamic splash shown immediately on first load, replaced once the app is ready.
         Placed BEFORE #root (so it can never be pushed below the app content during a
         reflow) and styled from <head> (so it paints centered on the very first frame). -->
    <div id="splash">
      <div class="splash-inner">
        <img src="/favicon.svg" alt="MyMedin" class="splash-logo" />
        <div class="splash-name">MyMedin</div>
        <div class="splash-track"><div id="splash-bar"></div></div>
        <div id="splash-pct">0%</div>
      </div>
    </div>
    <script src="/splash.js"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
